<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FADHILAH FASHION | Clothing Store</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 22px 8%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            letter-spacing: 2px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            background: #dedede;
            padding: 90px 8%;
            text-align: center;
        }

        .hero h1 {
            font-size: 45px;
            margin-bottom: 15px;
        }

        .hero p {
            margin-bottom: 25px;
        }

        .hero button, .buy {
            background: #111;
            color: white;
            border: none;
            padding: 13px 25px;
            cursor: pointer;
        }

        .container {
            padding: 50px 8%;
        }

        .container h2 {
            text-align: center;
            margin-bottom: 35px;
        }

        .products {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .product {
            background: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
        }

        .product img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 5px;
        }

        .product h3 {
            margin: 15px 0 8px;
        }

        .price {
            margin-bottom: 15px;
            font-weight: bold;
        }

        .cart {
            background: white;
            padding: 25px;
            margin-top: 35px;
            border-radius: 8px;
        }

        .cart h3 {
            margin-bottom: 15px;
        }

        .cart button {
            margin-top: 15px;
            padding: 12px 20px;
            background: #111;
            color: white;
            border: none;
            cursor: pointer;
        }

        footer {
            background: #111;
            color: white;
            text-align: center;
            padding: 25px;
            margin-top: 40px;
        }

        @media(max-width: 600px) {
            header {
                flex-direction: column;
                gap: 15px;
            }

            nav a {
                margin: 0 7px;
            }

            .hero h1 {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>FADHILAH FASHION</h2>
    <nav>
        <a href="#home">Home</a>
        <a href="#produk">Produk</a>
        <a href="#keranjang">Keranjang</a>
    </nav>
</header>

<section class="hero" id="home">
    <h1>WELCOME TO FADHILAH FASHION</h1>
    <p>Temukan fashion terbaik untuk gaya sehari-hari kamu.</p>
    <button onclick="document.getElementById('produk').scrollIntoView()">
        Belanja Sekarang
    </button>
</section>

<section class="container" id="produk">
    <h2>KOLEKSI PRODUK KAMI</h2>

    <div class="products" id="productList"></div>

    <div class="cart" id="keranjang">
        <h3>Keranjang Belanja</h3>
        <div id="cartItems">Keranjang masih kosong.</div>
        <h3 id="total">Total: Rp0</h3>
        <button onclick="checkout()">Pesan Melalui WhatsApp</button>
    </div>
</section>

<footer>
    <p>© 2026 FADHILAH FASHION. All Rights Reserved.</p>
</footer>

<script>
    const products = [
        {
            name: "Kaos Basic",
            price: 75000,
            image: "https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=500"
        },
        {
            name: "Hoodie Premium",
            price: 150000,
            image: "https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=500"
        },
        {
            name: "Kemeja Casual",
            price: 120000,
            image: "https://images.unsplash.com/photo-1598033129183-c4f50c736f10?w=500"
        },
        {
            name: "Jaket Fashion",
            price: 180000,
            image: "https://images.unsplash.com/photo-1551028719-00167b16eac5?w=500"
        }
    ];

    let cart = [];

    function displayProducts() {
        const list = document.getElementById("productList");

        list.innerHTML = products.map((product, index) => `
            <div class="product">
                <img src="${product.image}" alt="${product.name}">
                <h3>${product.name}</h3>
                <p class="price">Rp${product.price.toLocaleString("id-ID")}</p>
                <button class="buy" onclick="addToCart(${index})">
                    Tambah ke Keranjang
                </button>
            </div>
        `).join("");
    }

    function addToCart(index) {
        cart.push(products[index]);
        displayCart();
    }

    function displayCart() {
        const items = document.getElementById("cartItems");

        if (cart.length === 0) {
            items.innerHTML = "Keranjang masih kosong.";
        } else {
            items.innerHTML = cart.map((item, index) => `
                <p>
                    ${index + 1}. ${item.name} -
                    Rp${item.price.toLocaleString("id-ID")}
                    <button onclick="removeItem(${index})">Hapus</button>
                </p>
            `).join("");
        }

        const total = cart.reduce((sum, item) => sum + item.price, 0);

        document.getElementById("total").innerText =
            "Total: Rp" + total.toLocaleString("id-ID");
    }

    function removeItem(index) {
        cart.splice(index, 1);
        displayCart();
    }

    function checkout() {
        if (cart.length === 0) {
            alert("Keranjang masih kosong!");
            return;
        }

        const phone = "6281234567890";

        let message = "Halo, saya ingin memesan:\n\n";

        cart.forEach((item, index) => {
            message += `${index + 1}. ${item.name} - Rp${item.price.toLocaleString("id-ID")}\n`;
        });

        const total = cart.reduce((sum, item) => sum + item.price, 0);

        message += "\nTotal: Rp" + total.toLocaleString("id-ID");

        window.open(
            "https://wa.me/" + phone + "?text=" +
            encodeURIComponent(message),
            "_blank"
        );
    }

    displayProducts();
</script>

</body>
</html>
